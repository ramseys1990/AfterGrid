name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r core/requirements-dev.txt
      - run: python -m pytest -q
      - run: python recovery_prepare.py --help && python recovery_assets.py --help && python recovery_install.py --help
      - name: Native Docker image archive fixture
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf 'fixture\n' > "$tmp/payload"
          printf 'FROM scratch\nCOPY payload /payload\n' > "$tmp/Dockerfile"
          docker build -q -t aftergrid-ci-archive-fixture "$tmp" > "$tmp/id"
          python -c 'import recovery_assets as a,sys,pathlib; p=pathlib.Path(sys.argv[1]); a.save_images([{"image_id":(p/"id").read_text().strip()}],p/"images.tar")' "$tmp"
          docker image rm aftergrid-ci-archive-fixture
          docker image load -i "$tmp/images.tar"
          docker image inspect "$(cat "$tmp/id")" --format '{{.Id}}' | grep -Fx "$(cat "$tmp/id")"
      - run: bash -n install.sh && for file in modules/routing/*.sh; do sh -n "$file"; done; sh -n modules/tak/start.sh
      - run: node --check core/app.js && node --check core/maps.js && node --check core/region.js && node --check core/communications.js
      - run: docker compose config -q
      - run: docker compose build core worker
      - name: Disposable recovered-core startup acceptance
        timeout-minutes: 15
        run: sudo env AFTERGRID_DISPOSABLE_RECOVERY_TEST=1 python3 tests/recovery_core_smoke.py
      - name: Validate module Compose definitions
        run: |
          export MESHMONITOR_ADMIN_PASSWORD=disposable-ci-mesh-password MESHMONITOR_SESSION_SECRET=disposable-ci-session-secret
          export HBOX_AUTH_API_KEY_PEPPER=disposable-ci-placeholder-secret-1234567890
          export KOPIA_UI_PASSWORD=disposable-ci-ui-password KOPIA_PASSWORD=disposable-ci-repo-password
          for file in modules/*/compose.yaml; do docker compose -f "$file" config -q; done
      - name: Install disposable browser test runtime
        run: |
          pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Disposable Compose lifecycle smoke test
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          export AFTERGRID_ROOT="$PWD"
          export AFTERGRID_BIND=127.0.0.1 AFTERGRID_PORT=8080 AFTERGRID_ORIGIN=http://127.0.0.1:8080
          export SMOKE_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          mkdir -p data/notes data/core data/tak/data data/tak/backup data/media/config data/media/cache content/kiwix content/maps content/routing content/media
          cp modules/kiwix/library.xml content/kiwix/library.xml
          # Small, pinned OpenZIM upstream fixture; no live catalog dependency.
          curl --fail --silent --show-error --location --max-time 60 https://raw.githubusercontent.com/openzim/zim-testing-suite/2edf72096208e60c82b6ebbe313baa552cc6af52/data/withns/wikibooks_be_all_nopic_2017-02.zim -o content/kiwix/fixture.zim
          test "$(git hash-object content/kiwix/fixture.zim)" = 6706e9b279753c759ea77c8bd0250ce950bc819c
          # Stage a small raster PMTiles fixture outside the map content directory.
          curl --fail --silent --show-error --location --max-time 60 "https://raw.githubusercontent.com/protomaps/PMTiles/aec8fa1341222fdddb3318e9ffa8e18e19b312f7/spec/v3/stamen_toner(raster)CC-BY%2BODbL_z3.pmtiles" -o "$RUNNER_TEMP/aftergrid-map-fixture.pmtiles"
          test "$(git hash-object "$RUNNER_TEMP/aftergrid-map-fixture.pmtiles")" = 8d170ca89ecf3197d14366db63679f198a198101
          export MAP_FIXTURE="$RUNNER_TEMP/aftergrid-map-fixture.pmtiles"
          curl --fail --silent --show-error --location --max-time 60 https://raw.githubusercontent.com/valhalla/valhalla/3.9.3/test/data/liechtenstein-latest.osm.pbf -o content/routing/region.osm.pbf
          test "$(git hash-object content/routing/region.osm.pbf)" = 2c5877699db20b0b5bdab999586528c3ddb0ae63
          printf '%s\n' "$SMOKE_TOKEN" > data/core/setup-token
          sudo chown -R 10001:10001 data/notes data/core data/tak data/media content/kiwix content/maps content/routing content/media
          sudo chmod 700 data/media/config data/media/cache
          sudo chmod 700 data/tak/data data/tak/backup
          sudo chmod 700 data/core data/notes
          sudo chmod 600 data/core/setup-token
          cleanup() {
            export HBOX_AUTH_API_KEY_PEPPER=cleanup-placeholder KOPIA_UI_PASSWORD=cleanup-placeholder KOPIA_PASSWORD=cleanup-placeholder
            export MESHMONITOR_ADMIN_PASSWORD=cleanup-placeholder MESHMONITOR_SESSION_SECRET=cleanup-placeholder
            for module in kiwix homebox grocy kopia maps routing meshmonitor tak kolibri media notes; do
              docker compose -p "aftergrid-$module" -f "modules/$module/compose.yaml" down || true
            done
            docker compose logs --tail 50 || true
            docker compose down -v || true
            sudo ip address del "${AFTERGRID_LAN_BIND:-192.168.254.253}/32" dev lo || true
          }
          trap cleanup EXIT
          # A disposable private address on runner loopback; no external LAN needed.
          export AFTERGRID_LAN_BIND=192.168.254.253 AFTERGRID_LAN_DOMAIN=aftergrid.home.arpa
          sudo ip address add "$AFTERGRID_LAN_BIND/32" dev lo
          docker compose up -d --wait --wait-timeout 90
          python tests/smoke_compose.py
