name: aftergrid-core
services:
  core:
    build: ./core
    init: true
    restart: unless-stopped
    ports:
      - "${AFTERGRID_BIND:-127.0.0.1}:${AFTERGRID_PORT:-8080}:8080"
    environment:
      AFTERGRID_DATA: /data
      AFTERGRID_SECURE_COOKIE: "${AFTERGRID_SECURE_COOKIE:-false}"
      AFTERGRID_ORIGIN: "${AFTERGRID_ORIGIN:-}"
    volumes:
      - ./data/core:/data
      - ./content/kiwix:/content/kiwix:ro
      - worker_socket:/run/aftergrid:ro
    depends_on:
      worker:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  worker:
    build: ./worker
    init: true
    restart: unless-stopped
    environment:
      AFTERGRID_ROOT: "${AFTERGRID_ROOT:-/opt/aftergrid}"
      AFTERGRID_LAN_BIND: "${AFTERGRID_LAN_BIND:-}"
      AFTERGRID_LAN_DOMAIN: "${AFTERGRID_LAN_DOMAIN:-}"
      AFTERGRID_BIND: "${AFTERGRID_BIND:-127.0.0.1}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./modules:/modules:ro
      - worker_socket:/run/aftergrid
      - worker_state:/worker-state
    networks:
      - apps
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/aftergrid/worker.sock'); s.sendall(b'GET /health HTTP/1.0\\r\\n\\r\\n'); assert b'200 OK' in s.recv(1024)"]
      interval: 5s
      timeout: 4s
      retries: 10
    security_opt:
      - no-new-privileges:true
volumes:
  worker_socket:
  worker_state:
networks:
  apps:
    name: aftergrid-apps
