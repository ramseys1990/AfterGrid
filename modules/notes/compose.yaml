services:
  notes:
    image: dokuwiki/dokuwiki:2026-07-14c
    user: "10001:10001"
    init: true
    restart: unless-stopped
    environment:
      PHP_TIMEZONE: UTC
    ports:
      - "${AFTERGRID_MODULE_BIND:-127.0.0.1}:8097:8080"
    volumes:
      - type: bind
        source: ${AFTERGRID_ROOT:-/opt/aftergrid}/data/notes
        target: /storage
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      apps:
        aliases: [aftergrid-notes]
networks:
  apps:
    external: true
    name: aftergrid-apps
