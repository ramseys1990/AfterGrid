services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.27.1
    restart: unless-stopped
    environment:
      HBOX_OPTIONS_ALLOW_ANALYTICS: "false"
      HBOX_OPTIONS_ALLOW_REGISTRATION: "${AFTERGRID_HOMEBOX_REGISTRATION:-true}"
      HBOX_AUTH_API_KEY_PEPPER: "${HBOX_AUTH_API_KEY_PEPPER:?required}"
    ports:
      - "127.0.0.1:8082:7745"
    volumes:
      - "${AFTERGRID_ROOT:-/opt/aftergrid}/data/homebox:/data"
    networks:
      apps:
        aliases: [aftergrid-homebox]
networks:
  apps:
    external: true
    name: aftergrid-apps
